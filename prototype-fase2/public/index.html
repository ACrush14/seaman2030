<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Seaman2030 — Protótipo de Voz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Seaman2030 — protótipo de voz (Fase 2)</h1>
    <p id="status">carregando estado...</p>
  </header>

  <main>
    <div id="log"></div>

    <form id="textForm">
      <input id="textInput" type="text" placeholder="Digite aqui (sempre disponível, mesmo com voz)" autocomplete="off" />
      <button type="submit">Enviar</button>
    </form>

    <div id="voiceControls">
      <button id="talkButton">🎙️ Segurar para falar</button>
      <span id="latency"></span>
    </div>

    <div id="devControls">
      <button id="advanceButton">Avançar dia (teste acelerado)</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
